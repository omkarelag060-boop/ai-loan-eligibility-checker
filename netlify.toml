[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai-tips"
  to = "/.netlify/functions/ai-tips"
  status = 200

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
